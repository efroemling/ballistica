version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; the composite actions hold
    # most of the pins, so list them too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    labels:
      - "area/ci"
      - "kind/update"
      - "priority/low"
