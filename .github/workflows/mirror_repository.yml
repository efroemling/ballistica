name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ['*']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/efroemling/ballistica.git
          if [ "${{ github.ref_type }}" = "branch" ]; then
            git push gitlab HEAD:main --force
          fi
          git push gitlab --tags --force

      - name: Push to Codeberg
        run: |
          git remote add codeberg https://${{ secrets.CODEBERG_TOKEN }}@codeberg.org/efroemling/ballistica.git
          if [ "${{ github.ref_type }}" = "branch" ]; then
            git push codeberg HEAD:main --force
          fi
          git push codeberg --tags --force
