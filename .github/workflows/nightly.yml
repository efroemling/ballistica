name: Nightly Build
on:
  # Run everyday at 5:30 UTC
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  # Every job here skips SCHEDULED runs outside the main repo (the 'if'
  # on each). A fork inherits our schedule, and GitHub mails a scheduled
  # run's failures to whoever last edited the cron line -- us -- so
  # without this every fork's nightly reports to the wrong people. A
  # fork can still run this by hand (workflow_dispatch).

  make_docker_debug_image:
    name: make_docker_${{ matrix.variant }}_debug_image
    if: github.event_name != 'schedule' || github.repository == 'efroemling/ballistica'
    strategy:
      fail-fast: false
      matrix:
        variant: [gui, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and push the image
        uses: ./.github/actions/docker_image
        with:
          make-target: docker-${{ matrix.variant }}-debug
          image: bombsquad_${{ matrix.variant }}_debug
          push-as: bombsquad_${{ matrix.variant }}:debug_nightly_x86_64
          save: true
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: docker_${{ matrix.variant }}(debug)
          path: build/docker/bombsquad_${{ matrix.variant }}_debug_docker.tar

  make_docs:
    if: github.event_name != 'schedule' || github.repository == 'efroemling/ballistica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Make the build
        run: make docs
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: html_docs
          path: build/docs

  make_flatpak_gui_debug:
    if: github.event_name != 'schedule' || github.repository == 'efroemling/ballistica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Make the build
        uses: ./.github/actions/flatpak_build
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: bombsquad_${{ matrix.arch }}(debug).flatpak
          path: build/flatpak/bombsquad.flatpak
