name: Nightly Build
on:
  # Run everyday at 5:30 UTC
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  # Every job here skips SCHEDULED runs outside the main repo (the 'if'
  # on each). A fork inherits our schedule, and GitHub mails a scheduled
  # run's failures to whoever last edited the cron line -- us -- so
  # without this every fork's nightly reports to the wrong people. A
  # fork can still run this by hand (workflow_dispatch).

  make_docker_gui_debug_image:
    if: github.event_name != 'schedule' || github.repository == 'efroemling/ballistica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the build
        run: |
          make docker-gui-debug
          make docker-save
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: docker_gui(debug)
          path: build/docker/bombsquad_gui_debug_docker.tar
      - name: Push to github image repository
        run: |
          docker tag bombsquad_gui_debug:latest ghcr.io/${GITHUB_REPOSITORY,,}/bombsquad_gui:debug_nightly_x86_64
          docker push ghcr.io/${GITHUB_REPOSITORY,,}/bombsquad_gui:debug_nightly_x86_64

  make_docker_server_debug_image:
    if: github.event_name != 'schedule' || github.repository == 'efroemling/ballistica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the build
        run: |
          make docker-server-debug
          make docker-save
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: docker_server(debug)
          path: build/docker/bombsquad_server_debug_docker.tar
      - name: Push to github image repository
        run: |
          docker tag bombsquad_server_debug:latest ghcr.io/${GITHUB_REPOSITORY,,}/bombsquad_server:debug_nightly_x86_64
          docker push ghcr.io/${GITHUB_REPOSITORY,,}/bombsquad_server:debug_nightly_x86_64

  make_docs:
    if: github.event_name != 'schedule' || github.repository == 'efroemling/ballistica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Make the build
        run: make docs
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: html_docs
          path: build/docs

  make_flatpak_gui_debug:
    if: github.event_name != 'schedule' || github.repository == 'efroemling/ballistica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Cache Flatpak data
        id: cache-flatpak-sdk
        uses: actions/cache@v5
        env:
          cache-name: cache-flatpak
        with:
          path: |
            ~/.local/share/flatpak
            .cache/flatpak/flatpak-builder
            .cache/flatpak/repo
            !.cache/flatpak/flatpak-builder/build
          key: ${{ runner.os }}-${{runner.arch}}-${{ env.cache-name }}-${{ hashFiles('pconfig/flatpak/net.froemling.bombsquad.yml', 'pconfig/flatpak/python-build-env.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{runner.arch}}-${{ env.cache-name }}-
      - name: Install dependencies
        run: |
          sudo apt-get update
          # (Builds use Flathub's packaged org.flatpak.Builder, which
          # 'make flatpak-deps' installs; the distro's flatpak-builder
          # is too old for the manifest.)
          sudo apt install -y flatpak
      - name: Install flatpak build dependencies
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          make flatpak-deps

      - name: Make the build
        run: |
          make flatpak-linux
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: bombsquad_${{ matrix.arch }}(debug).flatpak
          path: build/flatpak/bombsquad.flatpak
