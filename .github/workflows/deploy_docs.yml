name: Deploy Documentation

on:
  push:
    branches:
      - main

jobs:
  setup_bombsquad_cache:
    # Docs deploys only make sense in the upstream repo (forks generally
    # don't have GitHub Pages set up, and their runs would just fail).
    if: github.repository == 'efroemling/ballistica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
        with:
          save-asset-cache: true
      - name: Make the build
        run: |
          make assets-cmake
          make assets-windows

  build:
    needs: setup_bombsquad_cache
    # Same runner as the cmake jobs: docs_build installs their build
    # packages (libsdl3-dev needs 26.04) and shares their sccache objects.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build documentation
        uses: ./.github/actions/docs_build
      - name: Upload the build
        uses: actions/upload-pages-artifact@v5
        with:
          name: html_docs
          path: build/docs

  deploy:
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: html_docs
