name: Deploy Documentation

on:
  push:
    branches:
      - main

jobs:
  check_pages:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check if GitHub Pages is enabled
        id: check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages not Enabled. Skipping Workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

  setup_bombsquad_cache:
    needs: check_pages
    if: needs.check_pages.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Make the build
        run: |
          make assets-cmake
          make assets-windows

  build:
    needs: [check_pages, setup_bombsquad_cache]
    if: needs.check_pages.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Build documentation
        run: make docs
      - name: Upload the build
        uses: actions/upload-pages-artifact@v5
        with:
          name: html_docs
          path: build/docs

  deploy:
    # Add a dependency to the build job
    needs: [check_pages, build]
    if: needs.check_pages.outputs.pages_enabled == 'true'

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: html_docs
