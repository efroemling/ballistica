  # ################################################################################
  # #                                                                              #
  # #                                    Flatpak                                   #
  # #                                                                              #
  # ################################################################################

  release_flatpak_gui_debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Cache Flatpak data
        id: cache-flatpak-sdk
        uses: actions/cache@v5
        env:
          cache-name: cache-flatpak
        with:
          path: |
            ~/.local/share/flatpak
            .cache/flatpak/flatpak-builder
            .cache/flatpak/repo
            !.cache/flatpak/flatpak-builder/build
          key: ${{ runner.os }}-${{runner.arch}}-${{ env.cache-name }}-${{ hashFiles('pconfig/flatpak/net.froemling.bombsquad.yml', 'pconfig/flatpak/python-build-env.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{runner.arch}}-${{ env.cache-name }}-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y flatpak flatpak-builder
      - name: Install flatpak build dependencies
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          make flatpak-deps

      - name: Make the build
        run: |
          make flatpak-linux
          mv build/flatpak/bombsquad.flatpak bombsquad_${{ matrix.arch }}.flatpak
      - name: Upload the build
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: bombsquad_${{ matrix.arch }}.flatpak

  ################################################################################
  #                                                                              #
  #                                   Flathub                                    #
  #                           (only runs on upstream)                            #
  ################################################################################

  release_flatpak_prebuilt_inputs:
    if: ${{ github.repository_owner == 'efroemling' || github.repository_owner == 'Loup-Garou911XD' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      # Flathub builds take the code from git at this tag; this archive
      # carries the rest (what a network-less build can't fetch, plus
      # this release's metadata entry). See pconfig/flatpak/README.md.
      - name: Add flatpak release metadata
        run: tools/pcommand flatpak_add_release "${GITHUB_REF_NAME}"
      - name: Pack the flatpak prebuilt inputs
        run: make flatpak-prebuilt-inputs
      - name: Upload the prebuilt inputs
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: build/flatpak/bombsquad_prebuilt_inputs.tar.xz

  # Opens a pull request against the app's Flathub repo
  # (flathub/net.froemling.bombsquad), whose master only takes PRs that
  # pass Flathub's test build. Merging the PR publishes the release; the
  # push-public skill does that once the test build is green. Upstream
  # only: forks must never open PRs against the real app repo.
  release_generate_flathub_manifest:
    if: ${{ github.repository_owner == 'efroemling' }}
    runs-on: ubuntu-latest
    needs: release_flatpak_prebuilt_inputs
    env:
      FLATHUB_REPO: flathub/net.froemling.bombsquad
      FLATHUB_BRANCH: update-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Clone the Flathub app repo
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git clone "https://github.com/${FLATHUB_REPO}" build/flathub
          cd build/flathub
          git checkout -b "${FLATHUB_BRANCH}"
      - name: Generate Flathub manifest
        env:
          # (Authenticates its GitHub API call; anonymous ones hit the
          # shared runner rate limit.)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make flatpak-generate-flathub-manifest
      - name: Open the Flathub pull request
        env:
          # A token with push access to the Flathub app repo; PRs are
          # opened as its owner.
          GH_TOKEN: ${{ secrets.FLATHUB_PUSH_PAT }}
        run: |
          cd build/flathub
          git add -A
          if git diff --cached --quiet; then
            echo "Flathub manifest already matches ${GITHUB_REF_NAME}; nothing to do."
            exit 0
          fi
          git commit -m "Update to ${GITHUB_REF_NAME}"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${FLATHUB_REPO}.git"
          # Forced so a re-run of this job replaces its own branch.
          git push --force origin "${FLATHUB_BRANCH}"
          if [ -n "$(gh pr list --repo "${FLATHUB_REPO}" --head "${FLATHUB_BRANCH}" --state open --json number --jq '.[].number')" ]; then
            echo "A PR for ${FLATHUB_BRANCH} is already open; it now has the new commit."
          else
            gh pr create --repo "${FLATHUB_REPO}" --base master \
              --head "${FLATHUB_BRANCH}" \
              --title "Update to ${GITHUB_REF_NAME}" \
              --body "Automated update to BombSquad ${GITHUB_REF_NAME}, generated by the ballistica release workflow (https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          fi
