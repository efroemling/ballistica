name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          body: "See the [Full Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"

  ################################################################################
  #                                                                              #
  #                         Prefabs (Linux, Mac, Windows)                        #
  #                                                                              #
  ################################################################################

  # One job per prefab: make target -> build/prefab/full/<prefab>/,
  # uploaded as <prefab>_debug.tar.
  release_prefab_debug_build:
    name: release_${{ matrix.prefab }}_debug_build
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefab: linux_x86_64_gui
            target: prefab-gui-debug-build
          - prefab: linux_x86_64_server
            target: prefab-server-debug-build
          - prefab: linux_arm64_gui
            target: prefab-linux-arm64-gui-debug-build
          - prefab: linux_arm64_server
            target: prefab-linux-arm64-server-debug-build
          - prefab: mac_arm64_gui
            target: prefab-mac-arm64-gui-debug-build
          - prefab: mac_arm64_server
            target: prefab-mac-arm64-server-debug-build
          - prefab: windows_x86_64_gui
            target: prefab-windows-x86-64-gui-debug-build
          - prefab: windows_x86_64_server
            target: prefab-windows-x86-64-server-debug-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Make the build
        run: make ${{ matrix.target }}
      - name: Compress the build
        run: tar -cf "${{ matrix.prefab }}_debug.tar" build/prefab/full/${{ matrix.prefab }}/
      - name: Upload the build
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: ${{ matrix.prefab }}_debug.tar

  ################################################################################
  #                                                                              #
  #                                   Docker                                     #
  #                                                                              #
  ################################################################################
  # Debug images: pushed and also attached to the release as a zip.
  release_docker_debug_image:
    name: release_docker_${{ matrix.variant }}_debug_image
    strategy:
      fail-fast: false
      matrix:
        variant: [gui, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and push the image
        uses: ./.github/actions/docker_image
        with:
          make-target: docker-${{ matrix.variant }}-debug
          image: bombsquad_${{ matrix.variant }}_debug
          push-as: bombsquad_${{ matrix.variant }}:debug_${{ github.ref_name }}_x86_64
          save: true
      - name: Zip the build
        run: zip -j bombsquad_docker_${{ matrix.variant }}_debug.tar.zip build/docker/bombsquad_${{ matrix.variant }}_debug_docker.tar
      - name: Upload the build
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: bombsquad_docker_${{ matrix.variant }}_debug.tar.zip

  # Release images: one per variant and arch, joined into multi-arch
  # :<tag> and :latest manifests below.
  upload_docker_release_image:
    name: upload_docker_${{ matrix.arch }}_${{ matrix.variant }}_release_image
    strategy:
      fail-fast: false
      matrix:
        variant: [gui, server]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            os: ubuntu-latest
            make-prefix: docker
          - arch: arm64
            os: ubuntu-24.04-arm
            make-prefix: docker-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and push the image
        uses: ./.github/actions/docker_image
        with:
          make-target: ${{ matrix.make-prefix }}-${{ matrix.variant }}-release
          image: bombsquad_${{ matrix.variant }}_release
          push-as: bombsquad_${{ matrix.variant }}:release_${{ github.ref_name }}_${{ matrix.arch }}

  manifest_docker_multiarch:
    name: manifest_docker_${{ matrix.variant }}_multiarch
    needs: upload_docker_release_image
    strategy:
      fail-fast: false
      matrix:
        variant: [gui, server]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ github.ref_name }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}/bombsquad_$VARIANT
          docker buildx imagetools create \
            --tag "$image:$TAG" --tag "$image:latest" \
            "$image:release_${TAG}_x86_64" "$image:release_${TAG}_arm64"

  ################################################################################
  #                                                                              #
  #                                    Docs                                      #
  #                                                                              #
  ################################################################################
  release_docs:
    # Same runner as the cmake jobs: docs_build installs their build
    # packages (libsdl3-dev needs 26.04) and shares their sccache objects.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Make the build
        uses: ./.github/actions/docs_build
      - name: Compress the build
        run: tar -cf "html_docs.tar" build/docs/
      - name: Upload the build
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: html_docs.tar

  # ################################################################################
  # #                                                                              #
  # #                                    Flatpak                                   #
  # #                                                                              #
  # ################################################################################

  release_flatpak_gui_debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Make the build
        uses: ./.github/actions/flatpak_build
      - name: Rename the build
        run: mv build/flatpak/bombsquad.flatpak bombsquad_${{ matrix.arch }}.flatpak
      - name: Upload the build
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: bombsquad_${{ matrix.arch }}.flatpak

  ################################################################################
  #                                                                              #
  #                                   Flathub                                    #
  #                           (only runs on upstream)                            #
  ################################################################################

  release_flatpak_prebuilt_inputs:
    if: ${{ github.repository_owner == 'efroemling' || github.repository_owner == 'Loup-Garou911XD' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      # Flathub builds take the code from git at this tag; this archive
      # carries the rest (what a network-less build can't fetch, plus
      # this release's metadata entry). See pconfig/flatpak/README.md.
      - name: Add flatpak release metadata
        run: tools/pcommand flatpak_add_release "${GITHUB_REF_NAME}"
      - name: Pack the flatpak prebuilt inputs
        run: make flatpak-prebuilt-inputs
      - name: Upload the prebuilt inputs
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: build/flatpak/bombsquad_prebuilt_inputs.tar.xz

  release_generate_flathub_manifest:
    if: ${{ github.repository_owner == 'efroemling' || github.repository_owner == 'Loup-Garou911XD' }}
    runs-on: ubuntu-latest
    needs: release_flatpak_prebuilt_inputs
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Configure flathub repo clone
        run: |
          git config --global user.email "90267658+Loup-Garou911XD@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          mkdir -p build/flathub
          git clone https://github.com/${{ github.repository_owner }}/flathub build/flathub
          cd build/flathub
          git fetch origin net.froemling.bombsquad
          git checkout -b net.froemling.bombsquad FETCH_HEAD
      - name: Generate Flathub manifest
        env:
          # (Authenticates its GitHub API call; anonymous ones hit the
          # shared runner rate limit.)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make flatpak-generate-flathub-manifest
      - name: Push changes
        env:
          FLATHUB_PUSH_PAT: ${{ secrets.FLATHUB_PUSH_PAT }}
        run: |
          cd build/flathub
          git remote set-url origin \
            https://x-access-token:${FLATHUB_PUSH_PAT}@github.com/${{ github.repository_owner }}/flathub.git
          git add -A
          git commit -m "Update flathub manifest to release ${{ github.ref_name }}"
          git push origin net.froemling.bombsquad
