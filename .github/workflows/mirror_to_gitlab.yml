name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ['*']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/efroemling/ballistica.git
          git push gitlab main --force
          git push gitlab --tags --force
